<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 15px; font-family: sans-serif; background: #f8f9fb; }
    .hidden { display: none !important; }

    #mainView { display: flex; flex-direction: column; gap: 10px; }
    button { 
      width: 100%; padding: 12px; cursor: pointer; 
      background: #1a73e8; color: white; border: none; border-radius: 8px;
      font-weight: bold; transition: background 0.2s ;
    }
    button:hover {background: #1557b0; }


    #settingsView { border-top: 1px solid #ddd; padding-top: 10px; margin-top: 10px; }
    input { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; 
    }
    
    .status { font-size: 12px; color: #5f6368; margin-top: 8px; line-height: 1.4; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .settings-toggle {
        display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; font-size: 20px; 
        cursor: pointer; border-radius: 50%; transition: background-color 0.2s; color: #5f6368; user-select: none 
    }
    .settings-toggle:hover { background-color: #e8eaed; color: #242020; }

  </style>
</head>
<body>
    <div class ="header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="margin-top: 0; font-size: 16px;">Review Autoreply Agent</h3>
        <span id="toggleSettings" class="settings-toggle"> &#9881; </span>
    </div>

<div id="mainView">
    <button id="generateBtn"> Generate & Paste Reply </button>
    <div id="status" class="status"> Highlight a review first. </div>
</div>


<div id="settingsView" class="hidden">
    <label style="font-size: 11px; font-weight: bold;"> Gemini API Key</label>
    <input type="password" id="apiKeyInput" placeholder="Paste you key here...">
    <button id="saveKeyBtn" style="background: #34a853; padding: 8px; font-size: 12px;"> Save Key </button>
</div>

<script src="popup.js"></script>
</body>
</html>
